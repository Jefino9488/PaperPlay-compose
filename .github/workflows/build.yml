name: Build PaperPlay (Android, Windows, Linux)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Android APK Build
  # ---------------------------------------------------------------------------
  build-android:
    name: Android (Debug APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Core & Player Unit Tests
        run: ./gradlew :core:jvmTest :player:jvmTest --no-daemon

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PaperPlay-Android-Debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows Desktop Build (Installer & Portable Zip)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Desktop Distribution & Installers
        run: .\gradlew.bat :desktopApp:createDistributable :desktopApp:packageDistributionForCurrentOS :desktopApp:packageMsi :desktopApp:packageExe --no-daemon

      - name: Create Portable Windows Zip
        shell: pwsh
        run: |
          $appDir = "desktopApp\build\compose\binaries\main\app"
          if (Test-Path $appDir) {
            Compress-Archive -Path "$appDir\*" -DestinationPath "desktopApp\build\PaperPlay-Windows-Portable.zip" -Force
          }

      - name: Upload Windows Binaries
        uses: actions/upload-artifact@v4
        with:
          name: PaperPlay-Windows-x64
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
            desktopApp/build/PaperPlay-Windows-Portable.zip
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Linux Desktop Build (Deb Package & Portable Tarball)
  # ---------------------------------------------------------------------------
  build-linux:
    name: Linux Desktop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies & VLC development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev libvlccore-dev fakeroot dpkg

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Desktop Distribution & Deb Package
        run: ./gradlew :desktopApp:createDistributable :desktopApp:packageDistributionForCurrentOS :desktopApp:packageDeb --no-daemon

      - name: Create Portable Linux Tarball
        run: |
          if [ -d "desktopApp/build/compose/binaries/main/app" ]; then
            tar -czvf "desktopApp/build/PaperPlay-Linux-Portable.tar.gz" -C "desktopApp/build/compose/binaries/main/app" .
          fi

      - name: Upload Linux Binaries
        uses: actions/upload-artifact@v4
        with:
          name: PaperPlay-Linux-x64
          path: |
            desktopApp/build/compose/binaries/main/deb/*.deb
            desktopApp/build/PaperPlay-Linux-Portable.tar.gz
          if-no-files-found: warn
