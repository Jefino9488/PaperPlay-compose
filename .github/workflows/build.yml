name: Build PaperPlay

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (Tests & Debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        if: env.ANDROID_HOME != ''
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          fi

      - name: Test and build Android Debug APK
        run: ./gradlew :core:jvmTest :player:jvmTest :androidApp:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PaperPlay-Android-Debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
            artifact: PaperPlay-Linux-x64.tar.gz
          - label: Windows
            os: windows-latest
            artifact: PaperPlay-Windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build desktop distribution
        if: runner.os == 'Linux'
        run: ./gradlew :desktopApp:createDistributable --no-daemon

      - name: Build desktop distribution
        if: runner.os == 'Windows'
        shell: cmd
        run: gradlew.bat :desktopApp:createDistributable --no-daemon

      - name: Package Linux archive
        if: runner.os == 'Linux'
        run: tar -czf desktopApp/build/${{ matrix.artifact }} -C desktopApp/build/compose/binaries/main/app .

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "desktopApp\build\compose\binaries\main\app\*" -DestinationPath "desktopApp\build\${{ matrix.artifact }}" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PaperPlay-${{ matrix.label }}-x64
          path: desktopApp/build/${{ matrix.artifact }}
          if-no-files-found: error
